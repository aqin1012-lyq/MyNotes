spring.application.name=MyNotes

# In-memory H2, recreated on every start from schema.sql / data.sql
spring.datasource.url=jdbc:h2:mem:mynotes
spring.h2.console.enabled=true

# Study site (http://localhost:8080/): progress, study log and notes are plain files here, commit them to git
mynotes.study.dir=study
# /vuln/** endpoints are deliberately exploitable: never listen beyond this machine
server.address=127.0.0.1
